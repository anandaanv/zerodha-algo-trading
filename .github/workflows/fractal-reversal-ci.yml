# CI for the fractal-reversal Python module (ds-python/fractal-reversal).
# Lives at the repo root because GitHub Actions only discovers workflows under
# the top-level .github/workflows/. Runs pytest on committed fixtures only --
# no credentials, no Kite, no memsys prod writes.
name: fractal-reversal CI

on:
  push:
    paths:
      - "ds-python/fractal-reversal/**"
      - ".github/workflows/fractal-reversal-ci.yml"
  pull_request:
    paths:
      - "ds-python/fractal-reversal/**"
      - ".github/workflows/fractal-reversal-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ds-python/fractal-reversal
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests (fixtures only, zero credentials)
        run: pytest
