# ─────────────────────────────────────────────────────────────────────────────
# TSFM Sidecar — nginx reverse-proxy block
#
# Drop this inside your existing `server { ... }` block, or include it as a
# separate file:
#
#   include /path/to/ds-python/nginx_sidecar.conf;
#
# The trailing slash on proxy_pass rewrites the path, so
#   /math/chronos/scan  →  http://localhost:11111/scan
# ─────────────────────────────────────────────────────────────────────────────

    # ── Chronos-Bolt (Tiny) ── port 11111 ────────────────────────────────────
    location /math/chronos/ {
        proxy_pass         http://127.0.0.1:11111/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ── Lag-Llama ── port 11112 ───────────────────────────────────────────────
    location /math/llama/ {
        proxy_pass         http://127.0.0.1:11112/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ── IBM Granite TTM ── port 11113 ─────────────────────────────────────────
    location /math/ttm/ {
        proxy_pass         http://127.0.0.1:11113/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
