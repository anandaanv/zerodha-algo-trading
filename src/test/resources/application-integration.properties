# Integration test profile — connects to real MySQL database
# Used by CopilotOrchestrationIntegrationTest to access real candle data
spring.datasource.driverClassName=com.mysql.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/algotrading?autoreconnect=true
spring.datasource.username=anand
spring.datasource.password=password
spring.datasource.hikari.maximum-pool-size=60
spring.datasource.hikari.minimum-idle=10
spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

hibernate.dialect.storage_engine=innodb

# Enable database-backed bar series loader
market.data.provider=database

# Kite API not needed for these tests
kite.api.key=test
kite.api.user=test
kite.api.secret=test
kite.apps.count=1

# JWT secret
jwt.secret=testSecretKey

# Dhan disabled for tests
dhan.enabled=false

# OpenAI — mocked in tests
openai.key=
openai.model=gpt-4o-mini
openai.baseUrl=https://api.openai.com/v1
openai.base-url=https://api.openai.com/v1
openai.apiKey=
spring.ai.openai.api-key=test-key
spring.ai.openai.chat.options.temperature=1
spring.ai.openai.chat.options.timeout=60000
spring.ai.retry.max-attempts=1

# Co-Pilot configuration
copilot.encryption.key=${COPILOT_ENCRYPTION_KEY:copilot-default-key-change-in-prod}
copilot.investigation.default-validity-minutes=60
copilot.async.core-pool-size=2
copilot.async.max-pool-size=4
copilot.async.queue-capacity=10

# Charts — not needed
matplotlib.python.script.path=src/main/python/matplotlib_chart.py
matplotlib.temp.directory=/tmp
matplotlib.gateway.port=25333
charts.output.directory=/tmp/charts
charts.temp.directory=/tmp/charts/temp
charts.use.tradingview=false
charts.browser.pool.size=1
charts.browser.timeout=10

# Jackson
spring.jackson.serialization.FAIL_ON_EMPTY_BEANS=false

# Logging
logging.level.com.dtech.kitecon.service.copilot=DEBUG
