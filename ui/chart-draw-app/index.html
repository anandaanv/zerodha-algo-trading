<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Chart Draw App</title>
    <style>
      html, body { height: 100%; margin: 0; }
      body { display: flex; flex-direction: column; }
      #root { flex: 1; min-height: 0; overflow: auto; }
      .toolbar { display: flex; gap: 8px; padding: 8px; border-bottom: 1px solid #ddd; }
      .container { display: grid; grid-template-rows: auto 1fr auto; height: 100%; }
      .chart-wrap { position: relative; height: 100%; }
      .overlay { position: absolute; left: 0; top: 0; right: 0; bottom: 0; pointer-events: none; z-index: 10; }
      .overlay svg { width: 100%; height: 100%; pointer-events: auto; display: block; }
      .overlay .interactive { pointer-events: auto; }
      button.active { background: #1976d2; color: #fff; }
      .panel { padding: 8px; display: flex; gap: 8px; align-items: center; }
      .panel input, .panel select { padding: 4px; }
      .tradingview-attribution {
        flex-shrink: 0;
        text-align: center;
        padding: 6px;
        font-size: 12px;
        color: #888;
        background: #fff;
        border-top: 1px solid #e0e0e0;
      }
      .tradingview-attribution a { color: #1976d2; text-decoration: none; }
      .tradingview-attribution a:hover { text-decoration: underline; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div class="tradingview-attribution">
      Charts powered by <a href="https://www.tradingview.com/" target="_blank" rel="noopener noreferrer">TradingView</a>
    </div>
    <!-- TradingView Charting Library -->
    <script type="text/javascript" src="/charting_library/charting_library/charting_library.standalone.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
